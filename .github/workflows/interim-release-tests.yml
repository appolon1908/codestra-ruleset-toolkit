name: Interim release migration tests
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
jobs:
  migration-tests:
    name: codestra/interim-release-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify migration and existing ruleset behavior
        run: python3 -m unittest discover -v
      - name: Verify existing gate classification
        run: bash test-gate-logic.sh
